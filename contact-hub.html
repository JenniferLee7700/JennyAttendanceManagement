<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공감 연락 허브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
    --navy: #172033;
    --navy-2: #1f2a40;
    --navy-3: #27344d;
    --navy-text: #e8ecf3;
    --navy-mute: #8490a6;
    --bg: #f3f4f6;
    --panel: #ffffff;
    --line: #e3e6eb;
    --line-soft: #eef0f3;
    --ink: #161b26;
    --ink-2: #3c4454;
    --mute: #7b8494;
    --faint: #b3bac6;
    --teal: #1f5a70;
    --teal-dark: #184a5d;
    --row-active: #e8f0f2;

    --need-bg: #fde7e7;   --need-fg: #b3261e;
    --new-bg: #e5ebfa;    --new-fg: #1f3fa6;
    --follow-bg: #fcf0d0; --follow-fg: #875a00;
    --done-bg: #e0f0e3;   --done-fg: #1f6b3a;

    --red: #c0392b; --amber: #a8690a; --blue: #2447a8; --green: #23703f;
    --side-w: 258px;
    --detail-w: 444px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
    font-family: 'Pretendard Variable', Pretendard, 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2px solid #4b8fa8; outline-offset: 2px; }

.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr) var(--detail-w); height: 100vh; }

/* ───────── 사이드바 ───────── */
.side { background: var(--navy); color: var(--navy-text); display: flex; flex-direction: column; padding: 22px 18px 24px; overflow-y: auto; }
.brand { padding: 0 8px; }
.brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.2px; }
.brand p { font-size: 12.5px; color: var(--navy-mute); margin-top: 1px; }
.side h2 { font-size: 11.5px; font-weight: 500; color: var(--navy-mute); padding: 0 8px; margin: 26px 0 6px; }
.nav { list-style: none; display: grid; gap: 1px; }
.nav button {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    padding: 8px 11px; border-radius: 6px; font-size: 14.5px; color: var(--navy-text); text-align: left;
}
.nav button:hover { background: var(--navy-2); }
.nav button[aria-pressed="true"] { background: var(--navy-3); font-weight: 700; }
.nav .n { font-size: 13px; font-variant-numeric: tabular-nums; color: #c5ccd9; }
.nav button[aria-pressed="true"] .n { color: #fff; font-weight: 700; }

.health { margin-top: auto; background: var(--navy-2); border-radius: 10px; padding: 13px 13px 11px; }
.health-wrap { margin-top: 28px; margin-top: auto; padding-top: 24px; }
.health header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.health header b { font-size: 12.5px; font-weight: 600; }
.health header span { font-size: 12px; color: var(--navy-mute); }
.health ul { list-style: none; }
.health li { display: flex; align-items: center; gap: 9px; font-size: 13px; padding: 3.5px 0; }
.health li i { width: 8px; height: 8px; border-radius: 50%; background: #4fb477; flex: none; }
.health li em { margin-left: auto; font-style: normal; font-size: 12px; color: var(--navy-mute); }
.health li.warn i { background: #e9a83a; }
.health li.bad i { background: #ef4b4b; box-shadow: 0 0 0 2px rgba(239,75,75,.25); }
.health li.bad, .health li.bad em { color: #ff7b72; }
.health li.bad em button { color: inherit; font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }

/* ───────── 메인 ───────── */
.main { padding: 24px 28px 40px; overflow-y: auto; min-width: 0; }
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.top h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
.top .when { font-size: 14px; color: var(--mute); }
.top .acts { margin-left: auto; display: flex; gap: 12px; }
.btn { height: 40px; padding: 0 17px; border-radius: 7px; font-size: 14.5px; font-weight: 600; white-space: nowrap; }
.btn.ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); font-weight: 500; }
.btn.ghost:hover { background: #f8f9fa; }
.btn.primary { background: var(--teal); color: #fff; }
.btn.primary:hover { background: var(--teal-dark); }
.btn[disabled] { opacity: .6; cursor: default; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
.stat { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 8px; padding: 13px 16px 14px 16px; }
.stat dt { font-size: 13.5px; color: var(--ink-2); }
.stat dd b { display: block; font-size: 31px; font-weight: 700; line-height: 1.15; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.stat dd span { display: block; font-size: 13px; color: var(--mute); margin-top: 4px; }

.bar { display: flex; align-items: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.chip { height: 32px; padding: 0 14px; border-radius: 16px; border: 1px solid var(--line); background: #fff; font-size: 14px; color: var(--ink-2); }
.chip:hover { border-color: #cbd0d8; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
.search { margin-left: auto; width: 244px; max-width: 100%; height: 36px; padding: 0 13px; border: 1px solid var(--line); border-radius: 7px; background: #fff; font-size: 14px; }
.search::placeholder { color: var(--faint); }

.list { margin-top: 16px; background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
col.c1 { width: 9.8%; } col.c2 { width: 14.2%; } col.c3 { width: 19%; } col.c5 { width: 13.6%; } col.c6 { width: 14.4%; }
th { text-align: left; font-size: 12.5px; font-weight: 500; color: var(--mute); padding: 9px 0 8px; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { padding-left: 18px; }
td { height: 50px; font-size: 14.5px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 12px; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: #f8fafb; }
tbody tr[aria-selected="true"] { background: var(--row-active); box-shadow: inset 3px 0 0 var(--teal); }
td.t { color: var(--mute); font-variant-numeric: tabular-nums; }
td.who { font-weight: 700; }
td.req { color: var(--ink-2); }
td.nx { font-variant-numeric: tabular-nums; }
td.nx.none { color: var(--faint); }
.empty { padding: 44px 18px; text-align: center; color: var(--mute); }

.src { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--ink-2); }
.src i { width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; font-style: normal; font-size: 11.5px; font-weight: 800; flex: none; }
.s-kakao i { background: #3a2c0a; color: #fee500; }
.s-kchan i { background: #fee500; color: #2b2200; }
.s-ntalk i, .s-nmail i { background: #03b54f; color: #fff; }
.s-gmail i { background: #d93025; color: #fff; }
.s-sms i { background: #5d6b82; color: #fff; }
.s-web i { background: #1f6f8b; color: #fff; }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.pill::before { content: ''; width: 7px; height: 7px; flex: none; background: currentColor; }
.p-need { background: var(--need-bg); color: var(--need-fg); } .p-need::before { transform: rotate(45deg); }
.p-new { background: var(--new-bg); color: var(--new-fg); } .p-new::before { border-radius: 2px; }
.p-follow { background: var(--follow-bg); color: var(--follow-fg); } .p-follow::before { background: none; border: 1.8px solid currentColor; border-radius: 50%; width: 9px; height: 9px; }
.p-done { background: var(--done-bg); color: var(--done-fg); } .p-done::before { border-radius: 2px; }

/* ───────── 상세 패널 ───────── */
.detail { background: #fff; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.d-body { padding: 24px 24px 20px; overflow-y: auto; flex: 1; }
.d-head { display: flex; align-items: center; gap: 10px; }
.d-head time { margin-left: auto; font-size: 13.5px; color: var(--mute); }
.d-close { display: none; width: 32px; height: 32px; border-radius: 6px; font-size: 20px; color: var(--mute); }
.d-body h3 { font-size: 20px; font-weight: 700; line-height: 1.4; letter-spacing: -0.3px; margin-top: 16px; max-width: 13.5em; word-break: keep-all; }
.d-meta { font-size: 13.5px; color: var(--mute); margin-top: 4px; }
.box { border: 1px solid var(--line); border-radius: 8px; padding: 13px 16px 16px; margin-top: 18px; }
.box > b { display: block; font-size: 12.5px; font-weight: 600; color: var(--mute); margin-bottom: 8px; }
.box p { font-size: 14.5px; line-height: 1.72; word-break: keep-all; }
.todo { list-style: none; display: grid; gap: 4px; }
.todo label { display: flex; align-items: flex-start; gap: 11px; font-size: 14.5px; padding: 3px 0; cursor: pointer; }
.todo input { appearance: none; width: 20px; height: 20px; border: 1.5px solid #9aa3b2; border-radius: 4px; flex: none; margin-top: 1px; cursor: pointer; display: grid; place-items: center; }
.todo input:checked { background: var(--teal); border-color: var(--teal); }
.todo input:checked::after { content: ''; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.todo input:checked + span { color: var(--faint); text-decoration: line-through; }
.appt { display: flex; align-items: center; gap: 14px; background: #fdf0cf; border-radius: 8px; padding: 14px 16px; margin-top: 18px; }
.appt .cal { width: 43px; height: 46px; background: #fff; border-radius: 6px; display: grid; place-content: center; text-align: center; flex: none; }
.appt .cal b { font-size: 16px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.appt .cal span { font-size: 11px; color: var(--amber); font-weight: 600; }
.appt strong { display: block; font-size: 15px; }
.appt small { font-size: 13px; color: var(--ink-2); }
.quote { background: #f5f6f8; border-radius: 8px; padding: 13px 16px 16px; margin-top: 18px; }
.quote > b { display: block; font-size: 12.5px; font-weight: 600; color: var(--mute); margin-bottom: 6px; }
.quote p { font-size: 13.5px; line-height: 1.75; color: var(--ink-2); word-break: keep-all; }
.mask { background: #e4e7ec; border-radius: 4px; padding: 1px 6px; font-variant-numeric: tabular-nums; letter-spacing: .5px; white-space: nowrap; }
.d-foot { padding: 14px 24px 22px; border-top: 1px solid transparent; }
.d-foot .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.d-foot .btn { height: 42px; width: 100%; }
.d-foot p { text-align: center; font-size: 12px; color: var(--mute); margin-top: 16px; }
.d-none { flex: 1; display: grid; place-items: center; color: var(--mute); padding: 24px; text-align: center; }

/* ───────── 대화상자 · 토스트 ───────── */
dialog { border: 0; border-radius: 12px; padding: 0; width: min(440px, calc(100vw - 32px)); margin: auto; box-shadow: 0 20px 50px rgba(15,23,42,.25); color: var(--ink); }
dialog::backdrop { background: rgba(15,23,42,.45); }
dialog header { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 6px; }
dialog header b { font-size: 17px; }
dialog header button { font-size: 20px; color: var(--mute); width: 32px; height: 32px; border-radius: 6px; }
dialog ul { list-style: none; padding: 6px 20px 8px; }
dialog li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: 14.5px; }
dialog li:last-child { border-bottom: 0; }
dialog li em { margin-left: auto; font-style: normal; font-size: 13px; color: var(--mute); }
dialog li em.bad { color: var(--need-fg); } dialog li em.warn { color: var(--follow-fg); }
dialog li .btn { height: 30px; padding: 0 11px; font-size: 13px; }
dialog footer { padding: 4px 20px 18px; font-size: 12.5px; color: var(--mute); }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: .2s; z-index: 50; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.scrim { display: none; }

/* ───────── 반응형 ───────── */
@media (max-width: 1280px) {
    .app { grid-template-columns: var(--side-w) minmax(0, 1fr); }
    .detail { position: fixed; top: 0; right: 0; bottom: 0; width: min(var(--detail-w), 100vw); transform: translateX(100%); transition: transform .2s; z-index: 30; box-shadow: -12px 0 40px rgba(15,23,42,.18); }
    .app.open .detail { transform: none; }
    .app.open .scrim { display: block; position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 20; }
    .d-close { display: block; }
    .d-head time { margin-left: auto; }
}
@media (max-width: 900px) {
    .app { display: block; height: auto; }
    .side { flex-direction: row; align-items: center; gap: 14px; padding: 12px 16px; overflow-x: auto; }
    .side h2, .health-wrap, .brand p { display: none; }
    .brand { padding: 0; white-space: nowrap; }
    .nav { display: flex; gap: 4px; }
    .nav button { gap: 8px; white-space: nowrap; padding: 6px 10px; font-size: 13.5px; }
    .main { padding: 18px 16px 40px; overflow: visible; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .search { margin-left: 0; width: 100%; }
    .top .acts { margin-left: 0; width: 100%; } .top .acts .btn { flex: 1; }
    col.c2, col.c6, th:nth-child(2), td:nth-child(2), th:nth-child(6), td:nth-child(6) { display: none; }
    col.c1 { width: 62px; } col.c3 { width: 30%; } col.c5 { width: 98px; }
    th:first-child, td:first-child { padding-left: 12px; }
    td { font-size: 14px; padding-right: 8px; }
}
@media (max-width: 520px) {
    col.c4, th:nth-child(4), td:nth-child(4) { display: none; }
    col.c3 { width: auto; }
    .stat dd b { font-size: 26px; }
}
</style>
</head>
<body>
<div class="app" id="app">

    <aside class="side">
        <div class="brand">
            <h1>공감 연락 허브</h1>
            <p>이 PC에서만 열림</p>
        </div>
        <h2>상태</h2>
        <ul class="nav" id="navStatus"></ul>
        <h2>채널</h2>
        <ul class="nav" id="navChannel"></ul>
        <div class="health-wrap">
            <section class="health" aria-label="채널 상태">
                <header><b>채널 상태</b><span id="healthAt"></span></header>
                <ul id="healthList"></ul>
            </section>
        </div>
    </aside>

    <main class="main">
        <div class="top">
            <h2>오늘 답할 것</h2>
            <span class="when" id="when"></span>
            <div class="acts">
                <button class="btn ghost" id="btnSettings">채널 설정</button>
                <button class="btn primary" id="btnCollect">지금 수집</button>
            </div>
        </div>

        <dl class="stats" id="stats"></dl>

        <div class="bar">
            <div id="chips" style="display:flex;gap:10px;flex-wrap:wrap"></div>
            <input class="search" id="search" type="search" placeholder="이름·내용 검색" aria-label="이름·내용 검색">
        </div>

        <div class="list">
            <table>
                <colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"><col class="c6"></colgroup>
                <thead><tr><th>시각</th><th>채널</th><th>보낸 사람</th><th>요청 요약</th><th>상태</th><th>다음 약속</th></tr></thead>
                <tbody id="rows"></tbody>
            </table>
            <div class="empty" id="empty" hidden>조건에 맞는 문의가 없습니다.</div>
        </div>
    </main>

    <div class="scrim" id="scrim"></div>
    <aside class="detail" id="detail" aria-label="문의 상세"></aside>
</div>

<dialog id="dlg">
    <header><b>채널 설정</b><button id="dlgClose" aria-label="닫기">×</button></header>
    <ul id="dlgList"></ul>
    <footer>로그인 정보와 수집한 내용은 이 PC에만 저장됩니다.</footer>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
/* ═════════ 기준 시각 (데모 데이터가 고정이라 "오늘"도 고정) ═════════ */
const TODAY = '2026-11-21';
const DOW = ['일', '월', '화', '수', '목', '금', '토'];

/* ═════════ 채널 정의 ═════════ */
const SOURCES = {
    kakao: { name: '카카오톡',   mark: '톡', group: 'kakao' },
    kchan: { name: '카카오채널', mark: '채', group: 'kchan' },
    ntalk: { name: '네이버 톡톡', mark: 'N', group: 'ntalk' },
    gmail: { name: '지메일',     mark: 'G', group: 'mail' },
    nmail: { name: '네이버 메일', mark: 'N', group: 'mail' },
    sms:   { name: '문자',       mark: '문', group: 'sms' },
    web:   { name: '홈페이지',   mark: '홈', group: 'web' },
};
const GROUPS = [['kakao', '카카오톡'], ['kchan', '카카오채널'], ['ntalk', '네이버 톡톡'], ['mail', '메일'], ['sms', '문자'], ['web', '홈페이지']];
const STATUS = { need: '답변 필요', new: '새 문의', follow: '후속 대기', done: '완료' };
// 사이드바·칩의 "답변 필요"는 아직 답하지 않은 것 전부(답변 필요 + 새 문의)
const BUCKET = { need: 'need', new: 'need', follow: 'follow', done: 'done' };

// 채널별 연결 상태: ok | warn | bad
const health = {
    kakao: { state: 'ok', last: 3 }, kchan: { state: 'ok', last: 2 },
    ntalk: { state: 'bad', msg: '다시 로그인' },
    gmail: { state: 'ok', last: 1 }, nmail: { state: 'ok', last: 0 },
    sms:   { state: 'warn', msg: '폰 연결 끊김' },
    web:   { state: 'ok', last: 1 },
};
let collectedAt = '14:02';

/* ═════════ 문의 데이터 ═════════
   at: 받은 시각 / msgs: 그 문의에 묶인 메시지 수 / reply: 답변까지 걸린 분(완료 건) */
const items = [
    { id: 1, at: '2026-11-21T13:47', src: 'kchan', who: '정서윤 어머님', meta: '중2 · 첫 문의', status: 'need', msgs: 2,
      title: '중2 겨울방학 특강 시간표와 레벨테스트 날짜 문의',
      summary: '겨울방학 영어 특강을 알아보는 신규 학부모. 시간표와 레벨테스트 가능한 날짜를 물었고, 평일 저녁 6시 이후만 가능하다고 함.',
      todos: ['중2 겨울특강 시간표 이미지 보내기', '레벨테스트 가능일 두 개 제안 (평일 18시 이후)', '16:00 통화 약속 전에 답장'],

            <div><strong>${n.t ? n.t + ' ' : ''}${esc(n.label)}</strong>${n.note ? `<small>${esc(n.note)}</small>` : ''}</div>
        </div>` : '';
    const quote = it.quote ? `
        <div class="quote"><b>원문 발췌 (가림 처리)</b>
            <p>「${esc(it.quote).replace('{tel}', '<span class="mask">010-••••-••••</span>')}」</p>
        </div>` : '';
    const acts = it.status === 'done'
        ? `<button class="btn ghost" data-set="need" style="grid-column:1/-1">다시 열기</button>`
        : `${it.status === 'follow'
              ? '<button class="btn ghost" data-set="need">답변 필요로</button>'
              : '<button class="btn ghost" data-set="follow">후속 대기로</button>'}
           <button class="btn primary" data-set="done">답변함으로 표시</button>`;
    el.innerHTML = `
        <div class="d-body">
            <div class="d-head">${srcTag(it.src)}${pill(it.status)}<time>${whenLong(it.at)}</time><button class="d-close" data-close aria-label="닫기">×</button></div>
            <h3>${esc(it.title)}</h3>
            <p class="d-meta">${esc(it.who)} · ${esc(it.meta)}</p>
            <div class="box"><b>Claude 요약</b><p>${esc(it.summary)}</p></div>
            <div class="box"><b>할 일</b>${todos}</div>
            ${appt}${quote}
        </div>
        <div class="d-foot">
            <div class="row">${acts}</div>
            <p>답장은 각 채널에서 직접 보냅니다. 이 화면은 읽기 전용입니다.</p>
        </div>`;
}

function renderWhen() {
    const x = new Date(TODAY + 'T00:00');
    $('when').textContent = `${x.getMonth() + 1}월 ${x.getDate()}일 ${DOW[x.getDay()]}요일 · 마지막 수집 ${collectedAt}`;
}
function render() { renderSide(); renderWhen(); renderStats(); renderChips(); renderRows(); renderDetail(); }

/* ═════════ 동작 ═════════ */
let toastTimer;
function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}
function select(id) { view.sel = id; $('app').classList.add('open'); renderRows(); renderDetail(); }
function closeDetail() { $('app').classList.remove('open'); }

document.querySelector('.side').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.bucket) { view.bucket = b.dataset.bucket; view.today = false; if (b.dataset.bucket === 'all') view.group = null; }
    else if (b.dataset.group) view.group = view.group === b.dataset.group ? null : b.dataset.group;
    else if (b.dataset.fix) return openSettings();
    render();
});
$('chips').addEventListener('click', e => {
    const b = e.target.closest('[data-chip]'); if (!b) return;
    if (b.dataset.chip === 'today') { view.today = true; view.bucket = 'all'; }
    else { view.today = false; view.bucket = b.dataset.chip; }
    render();
});
$('search').addEventListener('input', e => { view.q = e.target.value; renderRows(); });
$('rows').addEventListener('click', e => { const tr = e.target.closest('tr'); if (tr) select(+tr.dataset.id); });
$('rows').addEventListener('keydown', e => {
    const tr = e.target.closest('tr'); if (!tr) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(+tr.dataset.id); document.querySelector(`tr[data-id="${tr.dataset.id}"]`).focus(); }
    if (e.key === 'ArrowDown' && tr.nextElementSibling) { e.preventDefault(); tr.nextElementSibling.focus(); }
    if (e.key === 'ArrowUp' && tr.previousElementSibling) { e.preventDefault(); tr.previousElementSibling.focus(); }
});
$('detail').addEventListener('click', e => {
    if (e.target.closest('[data-close]')) return closeDetail();
    const b = e.target.closest('[data-set]'); if (!b) return;
    const it = items.find(x => x.id === view.sel);
    const to = b.dataset.set;
    if (to === 'done' && !it.reply) it.reply = Math.max(1, Math.round((new Date(`${TODAY}T${collectedAt}`) - new Date(it.at)) / 60000));
    it.status = to;
    toast(`${it.who} · ${STATUS[to]}${josa(STATUS[to], '으로', '로')} 옮겼습니다`);
    render();
});
$('detail').addEventListener('change', e => { const k = e.target.dataset.todo; if (k) checked[k] = e.target.checked; });
$('scrim').addEventListener('click', closeDetail);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

$('btnCollect').addEventListener('click', e => {
    const b = e.currentTarget; b.disabled = true; b.textContent = '수집 중…';
    setTimeout(() => {
        const now = new Date();
        collectedAt = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        Object.values(health).forEach(h => { if (h.state === 'ok') h.last = 0; });
        b.disabled = false; b.textContent = '지금 수집';
        const down = Object.entries(health).filter(([, h]) => h.state !== 'ok').map(([k]) => SOURCES[k].name);
        toast(down.length ? `새 문의 없음 · ${down.join(', ')}${josa(down[down.length - 1], '은', '는')} 수집하지 못했습니다` : '새로 들어온 문의가 없습니다');
        renderSide(); renderWhen();
    }, 700);
});

function openSettings() {
    $('dlgList').innerHTML = Object.entries(health).map(([k, h]) => {
        const right = h.state === 'ok' ? '<em>연결됨</em>'
            : `<em class="${h.state}">${h.state === 'bad' ? '로그인 만료' : h.msg}</em><button class="btn ghost" data-reconnect="${k}">${h.state === 'bad' ? '다시 로그인' : '다시 연결'}</button>`;
        return `<li>${srcTag(k)}${right}</li>`;
    }).join('');
    if (!$('dlg').open) $('dlg').showModal();
}
$('btnSettings').addEventListener('click', openSettings);
$('dlgClose').addEventListener('click', () => $('dlg').close());
$('dlg').addEventListener('click', e => {
    if (e.target === $('dlg')) return $('dlg').close();
    const b = e.target.closest('[data-reconnect]'); if (!b) return;
    health[b.dataset.reconnect] = { state: 'ok', last: 0 };
    toast(`${SOURCES[b.dataset.reconnect].name} 다시 연결했습니다`);
    openSettings(); renderSide();
});

render();
</script>
</body>
</html>
