name: 공감캡처 Windows 설치파일

on:
  push:
    paths:
      - 'gonggam-capture/**'
      - '.github/workflows/gonggam-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gonggam-capture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gonggam-capture/package-lock.json
      - run: npm ci
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: gonggam-capture-setup
          path: gonggam-capture/dist/*.exe
          if-no-files-found: error
