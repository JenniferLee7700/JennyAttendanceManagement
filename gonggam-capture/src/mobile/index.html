<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1f1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="공감캡처">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>공감캡처 — 폰으로 찍기</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0f1f1d;color:#eafff9;font-family:-apple-system,'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:0}
.sub{color:#8fb3aa;font-size:13px;margin:2px 0 22px}
label{display:block;font-size:13px;color:#8fb3aa;margin-bottom:6px}
input[type=text]{width:100%;font-size:18px;padding:14px;border-radius:14px;border:1px solid #2a443e;background:#16302b;color:#fff;outline:none}
input[type=text]:focus{border-color:#17c49d}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 22px;min-height:8px}
.chips button{font-size:14px;padding:7px 13px;border-radius:999px;border:1px solid #2a443e;background:transparent;color:#bfe0d8}
.chips button.on{background:#17c49d;border-color:#17c49d;color:#06231d;font-weight:700}
.shoot{width:100%;font-size:21px;font-weight:800;padding:26px 0;border:0;border-radius:20px;background:linear-gradient(135deg,#17c49d,#0f9b7c);color:#04201a;box-shadow:0 10px 28px rgba(23,196,157,.3)}
.shoot:active{transform:scale(.985)}
.album{width:100%;margin-top:12px;font-size:16px;padding:15px 0;border-radius:16px;border:1px solid #2a443e;background:transparent;color:#bfe0d8}
#status{margin-top:18px;font-size:14px;color:#8fb3aa;min-height:20px}
#status.err{color:#ff8f86}
#sent{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
#sent div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#16302b}
#sent img{width:100%;height:100%;object-fit:cover;display:block}
#sent div.wait img{opacity:.4}
#sent div.ok::after{content:'✓';position:absolute;right:4px;bottom:4px;background:#17c49d;color:#04201a;font-weight:800;font-size:12px;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%}
#sent div.fail::after{content:'!';position:absolute;right:4px;bottom:4px;background:#e3261b;color:#fff;font-weight:800;font-size:12px;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%}
.tip{margin-top:26px;font-size:12.5px;color:#6f918a;line-height:1.6}
</style>
</head>
<body>
<h1>공감캡처</h1>
<div class="sub" id="sub">찍으면 PC 라이브러리로 바로 들어갑니다</div>

<label for="cls">반 이름</label>
<input type="text" id="cls" placeholder="예: 중2 A반" autocomplete="off">
<div class="chips" id="chips"></div>

<button class="shoot" id="shoot">📷 찍어서 보내기</button>
<button class="album" id="album">앨범에서 고르기</button>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="pick" accept="image/*" multiple hidden>

<div id="status"></div>
<div id="sent"></div>
<div class="tip">PC와 같은 와이파이에 연결되어 있어야 합니다.<br>브라우저 메뉴에서 「홈 화면에 추가」를 누르면 앱처럼 열립니다.</div>

<script>
const $ = (id) => document.getElementById(id);
const cls = $('cls'), chips = $('chips'), statusEl = $('status'), sent = $('sent');
let okCount = 0;
cls.value = localStorage.getItem('gc-class') || '';

function setStatus(text, err) { statusEl.textContent = text; statusEl.className = err ? 'err' : ''; }
function renderChips(list) {
  chips.innerHTML = '';
  for (const name of list) {
    const b = document.createElement('button');
    b.textContent = name;
    if (name === cls.value) b.className = 'on';
    b.onclick = () => { cls.value = name; localStorage.setItem('gc-class', name); renderChips(list); };
    chips.appendChild(b);
  }
}
let classes = [];
cls.addEventListener('input', () => { localStorage.setItem('gc-class', cls.value); renderChips(classes); });

fetch('info').then((r) => r.json()).then((info) => {
  classes = info.classes || [];
  if (info.session) cls.value = info.session; // 수업 세션 중이면 그 반으로
  if (info.academy) $('sub').textContent = info.academy + ' · 찍으면 PC 라이브러리로 바로 들어갑니다';
  renderChips(classes);
}).catch(() => setStatus('PC에 연결하지 못했습니다. 같은 와이파이인지 확인해 주세요.', true));

// 긴 변 2400px 로 줄여 JPEG 로 보낸다 (방향 정보도 이때 바로잡힌다)
function shrink(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const max = 2400, r = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(im.naturalWidth * r); c.height = Math.round(im.naturalHeight * r);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => (b ? resolve(b) : reject(new Error('변환 실패'))), 'image/jpeg', 0.88);
    };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('사진을 읽지 못했습니다')); };
    im.src = url;
  });
}
async function sendAll(files) {
  for (const file of files) {
    const cell = document.createElement('div');
    cell.className = 'wait';
    const pv = document.createElement('img');
    pv.src = URL.createObjectURL(file);
    cell.appendChild(pv);
    sent.prepend(cell);
    setStatus('보내는 중…');
    try {
      const blob = await shrink(file);
      const r = await fetch('upload?session=' + encodeURIComponent(cls.value.trim()), { method: 'POST', headers: { 'content-type': 'image/jpeg' }, body: blob });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || '실패');
      cell.className = 'ok';
      okCount++;
      setStatus(`PC로 보냈습니다 · ${okCount}장`);
      if (navigator.vibrate) navigator.vibrate(30);
    } catch (e) {
      cell.className = 'fail';
      setStatus('보내지 못했습니다 — ' + e.message, true);
    }
  }
}
$('shoot').onclick = () => $('cam').click();
$('album').onclick = () => $('pick').click();
for (const id of ['cam', 'pick']) {
  $(id).addEventListener('change', (e) => { const files = [...e.target.files]; e.target.value = ''; sendAll(files); });
}
</script>
</body>
</html>
